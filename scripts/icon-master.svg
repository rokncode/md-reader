<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#64d2ff"/>
      <stop offset="0.5" stop-color="#0a84ff"/>
      <stop offset="1" stop-color="#5e5ce6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#eef4ff" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#001a4d" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#00205e" flood-opacity="0.28"/>
    </filter>
  </defs>
  <!-- macOS squircle, 824px content box centred on a 1024 canvas -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#g)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)" opacity="0.6"/>
  <!-- glass page -->
  <g filter="url(#soft)">
    <rect x="292" y="250" width="440" height="540" rx="64" fill="url(#page)"/>
  </g>
  <rect x="292.5" y="250.5" width="439" height="539" rx="63.5" fill="none" stroke="#ffffff" stroke-opacity="0.9"/>
  <text x="512" y="590" text-anchor="middle" font-size="300" font-weight="800" fill="#0a64e0"
        font-family="SF Arabic Rounded, SF Arabic, Geeza Pro, Noto Sans Arabic, sans-serif">ق</text>
  <rect x="372" y="660" width="280" height="22" rx="11" fill="#0a84ff" opacity="0.28"/>
  <rect x="412" y="704" width="200" height="22" rx="11" fill="#0a84ff" opacity="0.18"/>
</svg>
